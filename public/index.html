<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransBandung Monitor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { color: #007bff; text-align: center; font-size: 24px; margin-top: 0; }
        p { text-align: center; color: #666; margin-bottom: 25px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        
        button { 
            width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; 
            border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* Gaya untuk Kotak Pesan Notifikasi */
        #statusMessage {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none; /* Sembunyi secara default */
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }
        .loading { background-color: #e2f0ff; color: #0056b3; border: 1px solid #b8daff; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚌 TransBandung</h1>
        <p>Laporan Kendala Transportasi Kota</p>
        
        <form id="laporanForm">
            <label>Lokasi Kejadian</label>
            <input type="text" name="lokasi" placeholder="Contoh: Halte ITENAS" required>
            
            <label>Deskripsi Kendala</label>
            <textarea name="deskripsi" rows="4" placeholder="Ceritakan kendala yang terjadi..." required></textarea>
            
            <label>Foto Bukti (Upload ke S3)</label>
            <input type="file" name="foto" accept="image/*" required>
            
            <button type="submit" id="submitBtn">Kirim Laporan Sekarang</button>
        </form>

        <div id="statusMessage"></div>
        
        <div class="footer">
            ETS Cloud Computing - Institut Teknologi Nasional Bandung
        </div>
    </div>

    <script>
        const form = document.getElementById('laporanForm');
        const btn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMessage');

        form.onsubmit = async (e) => {
            e.preventDefault(); // Menghentikan pindah halaman ke JSON

            // 1. Persiapan UI (Tampilan Loading)
            btn.disabled = true;
            btn.innerText = "Sedang Mengirim...";
            statusMsg.style.display = "block";
            statusMsg.className = "loading";
            statusMsg.innerHTML = "⏳ <strong>Mohon Tunggu...</strong><br>Sedang mengunggah foto ke S3 Sydney dan menyimpan data ke RDS.";

            // 2. Ambil data dari form
            const formData = new FormData(form);

            try {
                // 3. Kirim data ke backend menggunakan Fetch API
                const response = await fetch('/lapor', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    // 4. Jika Berhasil
                    statusMsg.className = "success";
                    statusMsg.innerHTML = "✅ <strong>Berhasil!</strong><br>Laporan Anda telah sukses disimpan di Cloud (S3 & RDS).";
                    form.reset(); // Kosongkan form kembali
                } else {
                    // 5. Jika Gagal dari sisi Server
                    throw new Error(result.error || "Gagal mengirim laporan.");
                }
            } catch (error) {
                // 6. Jika Gagal Jaringan/Lainnya
                statusMsg.className = "error";
                statusMsg.innerHTML = "❌ <strong>Gagal!</strong><br>" + error.message;
            } finally {
                // 7. Kembalikan tombol ke semula
                btn.disabled = false;
                btn.innerText = "Kirim Laporan Sekarang";
            }
        };
    </script>
</body>
</html>
